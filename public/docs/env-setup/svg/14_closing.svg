<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Closing &#8212; what to remember</text>
<text x="40" y="56" class="subtitle">A working local environment is the foundation for everything else</text>
<g class="c-purple">
  <rect x="40" y="90" width="290" height="65" rx="8"/>
  <text x="56" y="116" class="th">Build tools</text>
  <text x="56" y="140" class="ts">Java 21, Node, Maven, Git installed and verified</text>
</g>
<g class="c-coral">
  <rect x="350" y="90" width="290" height="65" rx="8"/>
  <text x="366" y="116" class="th">Local runtime</text>
  <text x="366" y="140" class="ts">QuickStart Jar for Author and Publish</text>
</g>
<g class="c-red">
  <rect x="40" y="170" width="290" height="65" rx="8"/>
  <text x="56" y="196" class="th">Local Dispatcher</text>
  <text x="56" y="220" class="ts">Docker-based Apache with Dispatcher module</text>
</g>
<g class="c-amber">
  <rect x="350" y="170" width="290" height="65" rx="8"/>
  <text x="366" y="196" class="th">Project structure</text>
  <text x="366" y="220" class="ts">Maven modules mapped to repository areas</text>
</g>
<line x1="40" y1="280" x2="640" y2="280" class="divider"/>
<text x="40" y="305" class="th" fill="#3C3489">Key concepts for the exam</text>
<g class="c-blue">
  <rect x="40" y="310" width="600" height="35" rx="6"/>
  <text x="56" y="333" class="ts">&#8226; QuickStart Jar naming convention and startup rules</text>
</g>
<g class="c-blue">
  <rect x="40" y="355" width="600" height="35" rx="6"/>
  <text x="56" y="378" class="ts">&#8226; Mutable vs immutable repository areas</text>
</g>
<g class="c-blue">
  <rect x="40" y="400" width="600" height="35" rx="6"/>
  <text x="56" y="423" class="ts">&#8226; The role of each Maven module (core, ui.apps, ui.content, ui.config)</text>
</g>
<g class="c-blue">
  <rect x="40" y="445" width="600" height="35" rx="6"/>
  <text x="56" y="468" class="ts">&#8226; The all package as the single Cloud Manager deployment artifact</text>
</g>
<g class="c-blue">
  <rect x="40" y="490" width="600" height="35" rx="6"/>
  <text x="56" y="513" class="ts">&#8226; OAuth Server-to-Server is the only supported aio CLI auth (JWT removed Jan 2025)</text>
</g>
</svg>
