<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Repo Init and the AEM Project Archetype</text>
<text x="40" y="56" class="subtitle">Bootstrap repository structure and a new project</text>
<text x="40" y="90" class="th" fill="#3C3489">Repo Init</text>
<text x="40" y="110" class="ts">Defines JCR structures as part of the application.</text>
<g class="c-amber">
  <rect x="40" y="125" width="290" height="65" rx="8"/>
  <text x="56" y="150" class="th">Folder structures</text>
  <text x="56" y="172" class="ts">Initial /content paths and trees</text>
</g>
<g class="c-amber">
  <rect x="350" y="125" width="290" height="65" rx="8"/>
  <text x="366" y="150" class="th">Service users</text>
  <text x="366" y="172" class="ts">System users for OSGi services</text>
</g>
<g class="c-amber">
  <rect x="40" y="200" width="290" height="65" rx="8"/>
  <text x="56" y="225" class="th">Groups</text>
  <text x="56" y="247" class="ts">Authoring and access groups</text>
</g>
<g class="c-amber">
  <rect x="350" y="200" width="290" height="65" rx="8"/>
  <text x="366" y="225" class="th">ACL permissions</text>
  <text x="366" y="247" class="ts">Access control entries on nodes</text>
</g>
<text x="40" y="295" class="ts" font-style="italic">Scripts run early in the deploy lifecycle &#8212; live in <tspan font-family="Menlo, Monaco, Consolas, monospace" font-style="normal">ui.config</tspan>, scoped by run mode.</text>
<line x1="40" y1="320" x2="640" y2="320" class="divider"/>
<text x="40" y="345" class="th" fill="#3C3489">AEM Project Archetype (current version: 56)</text>
<text x="40" y="365" class="ts">Generates the full project structure with best practices in place.</text>
<g class="c-green">
  <rect x="40" y="390" width="100" height="40" rx="6"/>
  <text x="90" y="415" class="mono" text-anchor="middle">all</text>
</g>
<g class="c-green">
  <rect x="150" y="390" width="100" height="40" rx="6"/>
  <text x="200" y="415" class="mono" text-anchor="middle">core</text>
</g>
<g class="c-green">
  <rect x="260" y="390" width="100" height="40" rx="6"/>
  <text x="310" y="415" class="mono" text-anchor="middle">ui.apps</text>
</g>
<g class="c-green">
  <rect x="370" y="390" width="100" height="40" rx="6"/>
  <text x="420" y="415" class="mono" text-anchor="middle">ui.content</text>
</g>
<g class="c-green">
  <rect x="480" y="390" width="100" height="40" rx="6"/>
  <text x="530" y="415" class="mono" text-anchor="middle">ui.config</text>
</g>
<g class="c-green">
  <rect x="40" y="450" width="100" height="40" rx="6"/>
  <text x="90" y="475" class="mono" text-anchor="middle">ui.frontend</text>
</g>
<g class="c-green">
  <rect x="150" y="450" width="100" height="40" rx="6"/>
  <text x="200" y="475" class="mono" text-anchor="middle">tests</text>
</g>
<g class="c-green">
  <rect x="260" y="450" width="100" height="40" rx="6"/>
  <text x="310" y="475" class="mono" text-anchor="middle">dispatcher</text>
</g>
<line x1="40" y1="510" x2="640" y2="510" class="divider"/>
<text x="40" y="535" class="ts">The Archetype is the recommended starting point for any new AEM project.</text>
<text x="40" y="557" class="ts" font-style="italic">It generates module wiring, parent POMs, run modes, and dispatcher templates automatically.</text>
</svg>
