<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Maven modules and package types</text>
<text x="40" y="56" class="subtitle">Each module deploys a specific kind of content</text>
<g class="c-purple">
  <rect x="40" y="90" width="600" height="65" rx="8"/>
  <text x="56" y="114" class="mono">core</text>
  <text x="200" y="114" class="ts" font-style="italic">type: application</text>
  <text x="56" y="140" class="ts">Java OSGi bundle &#8212; services, models, servlets</text>
</g>
<g class="c-coral">
  <rect x="40" y="170" width="600" height="65" rx="8"/>
  <text x="56" y="194" class="mono">ui.apps</text>
  <text x="200" y="194" class="ts" font-style="italic">type: application</text>
  <text x="56" y="220" class="ts">Code package, deploys to /apps</text>
</g>
<g class="c-coral">
  <rect x="40" y="250" width="600" height="65" rx="8"/>
  <text x="56" y="274" class="mono">ui.content</text>
  <text x="200" y="274" class="ts" font-style="italic">type: content</text>
  <text x="56" y="300" class="ts">Content package, deploys to /content and /conf</text>
</g>
<g class="c-amber">
  <rect x="40" y="330" width="600" height="65" rx="8"/>
  <text x="56" y="354" class="mono">ui.config</text>
  <text x="200" y="354" class="ts" font-style="italic">type: content</text>
  <text x="56" y="380" class="ts">OSGi configurations and Repo Init scripts</text>
</g>
<g class="c-green">
  <rect x="40" y="410" width="600" height="65" rx="8"/>
  <text x="56" y="434" class="mono">all</text>
  <text x="200" y="434" class="ts" font-style="italic">type: container</text>
  <text x="56" y="460" class="ts">Container package &#8212; the only artifact deployed by Cloud Manager</text>
</g>
<line x1="40" y1="495" x2="640" y2="495" class="divider"/>
<text x="40" y="520" class="th" fill="#27500A">The all package is special</text>
<g class="c-green">
  <rect x="40" y="535" width="600" height="100" rx="8"/>
  <text x="56" y="560" class="ts">It embeds every other module and is the single deployment artifact.</text>
  <text x="56" y="582" class="ts">All other packages must set</text>
  <text x="56" y="604" class="mono">cloudManagerTarget=none</text>
  <text x="56" y="624" class="ts">so Cloud Manager ignores them.</text>
</g>
</svg>
