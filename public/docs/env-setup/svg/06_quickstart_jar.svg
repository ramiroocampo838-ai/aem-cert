<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">The QuickStart Jar</text>
<text x="40" y="56" class="subtitle">Self-contained JAR that runs a full AEM instance locally</text>
<g class="c-coral">
  <rect x="40" y="90" width="290" height="100" rx="8"/>
  <text x="56" y="116" class="th">Author</text>
  <text x="56" y="138" class="ts">Authoring environment for content</text>
  <text x="56" y="160" class="mono">Port 4502</text>
  <text x="56" y="182" class="mono">aem-author-p4502.jar</text>
</g>
<g class="c-teal">
  <rect x="350" y="90" width="290" height="100" rx="8"/>
  <text x="366" y="116" class="th">Publish</text>
  <text x="366" y="138" class="ts">Public-facing render service</text>
  <text x="366" y="160" class="mono">Port 4503</text>
  <text x="366" y="182" class="mono">aem-publish-p4503.jar</text>
</g>
<line x1="40" y1="220" x2="640" y2="220" class="divider"/>
<text x="40" y="247" class="th" fill="#791F1F">Two important rules</text>
<g class="c-red">
  <rect x="40" y="260" width="600" height="80" rx="8"/>
  <text x="56" y="286" class="th">1. Never double-click the JAR file</text>
  <text x="56" y="310" class="ts">It must be started from the command line so the filename</text>
  <text x="56" y="328" class="ts">conventions for tier, environment, and port apply correctly.</text>
</g>
<g class="c-green">
  <rect x="40" y="360" width="600" height="80" rx="8"/>
  <text x="56" y="386" class="th">2. Always start it like this</text>
  <text x="56" y="412" class="mono">java -jar aem-author-p4502.jar</text>
  <text x="56" y="432" class="ts">From the directory that contains the JAR file.</text>
</g>
<line x1="40" y1="470" x2="640" y2="470" class="divider"/>
<text x="40" y="497" class="ts">Source: Adobe Software Distribution (part of the AEMaaCS SDK).</text>
</svg>
