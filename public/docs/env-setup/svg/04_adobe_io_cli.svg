<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Adobe I/O CLI (aio)</text>
<text x="40" y="56" class="subtitle">Command-line tool to interact with Adobe services</text>
<text x="40" y="90" class="th" fill="#3C3489">1. Install globally</text>
<g class="c-purple">
  <rect x="40" y="100" width="600" height="50" rx="8"/>
  <text x="56" y="130" class="mono">npm install -g @adobe/aio-cli</text>
</g>
<text x="40" y="185" class="th" fill="#3C3489">2. Add plugins for the services you need</text>
<g class="c-blue">
  <rect x="40" y="200" width="600" height="55" rx="8"/>
  <text x="56" y="222" class="th">Cloud Manager plugin</text>
  <text x="56" y="244" class="ts">Manage pipelines, environments, deployments</text>
</g>
<g class="c-blue">
  <rect x="40" y="270" width="600" height="55" rx="8"/>
  <text x="56" y="292" class="th">AEM Rapid Development Environment (RDE)</text>
  <text x="56" y="314" class="ts">Push code to a sandbox for fast iteration</text>
</g>
<g class="c-blue">
  <rect x="40" y="340" width="600" height="55" rx="8"/>
  <text x="56" y="362" class="th">Asset Compute plugin</text>
  <text x="56" y="384" class="ts">Develop and test custom asset workers</text>
</g>
<line x1="40" y1="420" x2="640" y2="420" class="divider"/>
<text x="40" y="445" class="th" fill="#3C3489">3. Authenticate</text>
<g class="c-red">
  <rect x="40" y="455" width="290" height="85" rx="8"/>
  <text x="56" y="478" class="th">JWT (deprecated)</text>
  <text x="56" y="502" class="ts">Removed January 2025.</text>
  <text x="56" y="522" class="ts">No longer supported.</text>
</g>
<g class="c-green">
  <rect x="350" y="455" width="290" height="85" rx="8"/>
  <text x="366" y="478" class="th">OAuth Server-to-Server</text>
  <text x="366" y="502" class="ts">The only supported method now.</text>
  <text x="366" y="522" class="ts">Configured in Adobe Developer Console.</text>
</g>
</svg>
