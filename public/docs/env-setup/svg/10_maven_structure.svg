<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Maven project structure: code vs content</text>
<text x="40" y="56" class="subtitle">AEM enforces a clear separation between the two</text>
<g class="c-red">
  <rect x="40" y="90" width="290" height="60" rx="8"/>
  <text x="56" y="115" class="th">Immutable</text>
  <text x="56" y="137" class="ts">Cannot be changed at runtime</text>
</g>
<g class="c-green">
  <rect x="350" y="90" width="290" height="60" rx="8"/>
  <text x="366" y="115" class="th">Mutable</text>
  <text x="366" y="137" class="ts">Can be changed at runtime</text>
</g>
<g class="c-coral">
  <rect x="40" y="170" width="290" height="70" rx="8"/>
  <text x="56" y="195" class="mono">/apps</text>
  <text x="56" y="217" class="ts">Your custom components,</text>
  <text x="56" y="234" class="ts">scripts, clientlibs</text>
</g>
<g class="c-red">
  <rect x="40" y="255" width="290" height="70" rx="8"/>
  <text x="56" y="280" class="mono">/libs</text>
  <text x="56" y="302" class="ts">AEM platform code</text>
  <text x="56" y="319" class="ts">Never touch this</text>
</g>
<g class="c-coral">
  <rect x="350" y="170" width="290" height="70" rx="8"/>
  <text x="366" y="195" class="mono">/content</text>
  <text x="366" y="217" class="ts">Pages, assets, authored data</text>
</g>
<g class="c-amber">
  <rect x="350" y="255" width="290" height="70" rx="8"/>
  <text x="366" y="280" class="mono">/conf</text>
  <text x="366" y="302" class="ts">Configuration (CAConfig)</text>
</g>
<g class="c-pink">
  <rect x="350" y="340" width="290" height="55" rx="8"/>
  <text x="366" y="365" class="mono">/var</text>
  <text x="366" y="385" class="ts">Runtime data, queues, indexes</text>
</g>
<g class="c-gray">
  <rect x="350" y="410" width="290" height="55" rx="8"/>
  <text x="366" y="435" class="mono">/etc</text>
  <text x="366" y="455" class="ts">Legacy configuration tree</text>
</g>
<line x1="40" y1="490" x2="640" y2="490" class="divider"/>
<text x="40" y="515" class="ts">Each type of content belongs in a <tspan font-weight="500">specific Maven module</tspan> &#8212; covered next.</text>
</svg>
