<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Simulating content distribution locally</text>
<text x="40" y="56" class="subtitle">Author publishes content to Publish via Replication Agents</text>
<text x="40" y="95" class="th" fill="#3C3489">Cloud vs local</text>
<g class="c-blue">
  <rect x="40" y="110" width="290" height="80" rx="8"/>
  <text x="56" y="134" class="th">In production</text>
  <text x="56" y="156" class="ts">Adobe Pipeline (cloud-only</text>
  <text x="56" y="174" class="ts">microservice)</text>
</g>
<g class="c-amber">
  <rect x="350" y="110" width="290" height="80" rx="8"/>
  <text x="366" y="134" class="th">Locally</text>
  <text x="366" y="156" class="ts">Legacy Replication Agents</text>
  <text x="366" y="174" class="ts">(simulation of the pipeline)</text>
</g>
<line x1="40" y1="215" x2="640" y2="215" class="divider"/>
<text x="40" y="245" class="th" fill="#3C3489">Local replication flow</text>
<g class="c-coral">
  <rect x="40" y="265" width="160" height="70" rx="8"/>
  <text x="56" y="290" class="th">Author</text>
  <text x="56" y="312" class="ts">localhost:4502</text>
</g>
<g class="c-amber">
  <rect x="240" y="265" width="200" height="70" rx="8"/>
  <text x="256" y="290" class="th">Default Agent</text>
  <text x="256" y="312" class="ts">Transport: localhost:4503</text>
</g>
<g class="c-teal">
  <rect x="480" y="265" width="160" height="70" rx="8"/>
  <text x="496" y="290" class="th">Publish</text>
  <text x="496" y="312" class="ts">localhost:4503</text>
</g>
<path d="M 200 300 L 240 300" class="arr" marker-end="url(#arrow)"/>
<path d="M 440 300 L 480 300" class="arr" marker-end="url(#arrow)"/>
<line x1="40" y1="365" x2="640" y2="365" class="divider"/>
<text x="40" y="390" class="th" fill="#3C3489">Steps to enable</text>
<text x="56" y="415" class="ts">&#8226; Open <tspan font-family="Menlo, Monaco, Consolas, monospace" fill="#2C2C2A">/etc/replication/agents.author.html</tspan> on the Author service</text>
<text x="56" y="440" class="ts">&#8226; Open the <tspan font-family="Menlo, Monaco, Consolas, monospace" fill="#2C2C2A">Default Agent</tspan> configuration</text>
<text x="56" y="465" class="ts">&#8226; Enable it and set the transport URI to <tspan font-family="Menlo, Monaco, Consolas, monospace" fill="#2C2C2A">http://localhost:4503</tspan></text>
<text x="40" y="510" class="ts" font-style="italic">After this, anything you publish on Author replicates to your local Publish.</text>
</svg>
