<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">The four core development tools</text>
<text x="40" y="56" class="subtitle">Install &#8594; verify with a version command</text>
<g class="c-purple">
  <rect x="40" y="90" width="290" height="115" rx="8"/>
  <text x="56" y="118" class="th">Java JDK 21</text>
  <text x="56" y="144" class="ts">AEM is a Java application</text>
  <text x="56" y="180" class="mono">java -version</text>
</g>
<g class="c-amber">
  <rect x="350" y="90" width="290" height="115" rx="8"/>
  <text x="366" y="118" class="th">Apache Maven</text>
  <text x="366" y="144" class="ts">Build tool for AEM projects</text>
  <text x="366" y="180" class="mono">mvn -v</text>
</g>
<g class="c-teal">
  <rect x="40" y="230" width="290" height="115" rx="8"/>
  <text x="56" y="258" class="th">Node.js</text>
  <text x="56" y="284" class="ts">Front-end tooling and aio CLI</text>
  <text x="56" y="320" class="mono">node --version</text>
</g>
<g class="c-blue">
  <rect x="350" y="230" width="290" height="115" rx="8"/>
  <text x="366" y="258" class="th">Git</text>
  <text x="366" y="284" class="ts">Source control</text>
  <text x="366" y="320" class="mono">git --version</text>
</g>
<line x1="40" y1="395" x2="640" y2="395" class="divider"/>
<text x="40" y="420" class="ts">Java 21 is the <tspan font-weight="500">recommended</tspan> version for AEM.</text>
<text x="40" y="442" class="ts" font-style="italic">Always verify each install with the version command before moving on.</text>
</svg>
