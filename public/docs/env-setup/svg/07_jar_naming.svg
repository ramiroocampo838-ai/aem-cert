<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">QuickStart Jar naming convention</text>
<text x="40" y="56" class="subtitle">The filename controls how AEM starts</text>
<text x="40" y="100" class="th">Format</text>
<g class="c-gray">
  <rect x="70" y="120" width="60" height="40" rx="6"/>
  <text x="100.0" y="145" class="mono" text-anchor="middle">aem</text>
</g>
<g class="c-gray">
  <rect x="130" y="120" width="15" height="40" rx="6"/>
  <text x="137.5" y="145" class="mono" text-anchor="middle">-</text>
</g>
<g class="c-coral">
  <rect x="145" y="120" width="90" height="40" rx="6"/>
  <text x="190.0" y="145" class="mono" text-anchor="middle">&lt;tier&gt;</text>
</g>
<g class="c-gray">
  <rect x="235" y="120" width="15" height="40" rx="6"/>
  <text x="242.5" y="145" class="mono" text-anchor="middle">_</text>
</g>
<g class="c-amber">
  <rect x="250" y="120" width="130" height="40" rx="6"/>
  <text x="315.0" y="145" class="mono" text-anchor="middle">&lt;environment&gt;</text>
</g>
<g class="c-gray">
  <rect x="380" y="120" width="30" height="40" rx="6"/>
  <text x="395.0" y="145" class="mono" text-anchor="middle">-p</text>
</g>
<g class="c-blue">
  <rect x="410" y="120" width="80" height="40" rx="6"/>
  <text x="450.0" y="145" class="mono" text-anchor="middle">&lt;port&gt;</text>
</g>
<g class="c-gray">
  <rect x="490" y="120" width="50" height="40" rx="6"/>
  <text x="515.0" y="145" class="mono" text-anchor="middle">.jar</text>
</g>
<line x1="40" y1="190" x2="640" y2="190" class="divider"/>
<text x="40" y="215" class="th" fill="#3C3489">Examples</text>
<g class="c-coral">
  <rect x="40" y="230" width="600" height="50" rx="8"/>
  <text x="56" y="252" class="mono">aem-author-p4502.jar</text>
  <text x="56" y="272" class="ts">Author in Dev mode on port 4502</text>
</g>
<g class="c-teal">
  <rect x="40" y="290" width="600" height="50" rx="8"/>
  <text x="56" y="312" class="mono">aem-publish-p4503.jar</text>
  <text x="56" y="332" class="ts">Publish in Dev mode on port 4503</text>
</g>
<g class="c-amber">
  <rect x="40" y="350" width="600" height="50" rx="8"/>
  <text x="56" y="372" class="mono">aem-author_prod-p4502.jar</text>
  <text x="56" y="392" class="ts">Author in Production mode (env-specific config)</text>
</g>
<line x1="40" y1="425" x2="640" y2="425" class="divider"/>
<text x="40" y="450" class="th" fill="#791F1F">Tier is locked on first startup</text>
<g class="c-red">
  <rect x="40" y="460" width="600" height="80" rx="8"/>
  <text x="56" y="486" class="ts">Once an AEM instance has started as Author or Publish, the tier cannot</text>
  <text x="56" y="506" class="ts">be changed. To switch, you must delete the crx-quickstart folder</text>
  <text x="56" y="526" class="ts">and start fresh with the new JAR name.</text>
</g>
<text x="40" y="572" class="ts" font-style="italic">The environment mode is useful for testing environment-specific OSGi configurations.</text>
</svg>
