<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">The eight categories of AEM code quality</text>
<text x="40" y="56" class="subtitle">A roadmap of what this guide covers</text>
<g class="c-purple">
  <rect x="40" y="90" width="125" height="110" rx="8"/>
  <text x="52" y="114" class="th">SonarQube</text>
  <text x="52" y="140" class="ts">Bugs: leaks, NPEs,</text>
  <text x="52" y="158" class="ts">races, secrets</text>
</g>
<g class="c-purple">
  <rect x="205" y="90" width="125" height="110" rx="8"/>
  <text x="217" y="114" class="th">Code Smells</text>
  <text x="217" y="140" class="ts">Complexity,</text>
  <text x="217" y="158" class="ts">logging, deprecation</text>
</g>
<g class="c-coral">
  <rect x="370" y="90" width="125" height="110" rx="8"/>
  <text x="382" y="114" class="th">Best Practices</text>
  <text x="382" y="140" class="ts">Service users,</text>
  <text x="382" y="158" class="ts">Sling Models, APIs</text>
</g>
<g class="c-amber">
  <rect x="535" y="90" width="125" height="110" rx="8"/>
  <text x="547" y="114" class="th">OakPAL</text>
  <text x="547" y="140" class="ts">Content package</text>
  <text x="547" y="158" class="ts">&amp; repo rules</text>
</g>
<g class="c-teal">
  <rect x="40" y="220" width="125" height="110" rx="8"/>
  <text x="52" y="244" class="th">HTL / Sightly</text>
  <text x="52" y="270" class="ts">Template security,</text>
  <text x="52" y="288" class="ts">XSS prevention</text>
</g>
<g class="c-blue">
  <rect x="205" y="220" width="125" height="110" rx="8"/>
  <text x="217" y="244" class="th">OSGi / Felix</text>
  <text x="217" y="270" class="ts">Bundles, services,</text>
  <text x="217" y="288" class="ts">lifecycle</text>
</g>
<g class="c-red">
  <rect x="370" y="220" width="125" height="110" rx="8"/>
  <text x="382" y="244" class="th">Dispatcher</text>
  <text x="382" y="270" class="ts">HTTP boundary,</text>
  <text x="382" y="288" class="ts">cache, security</text>
</g>
<g class="c-green">
  <rect x="535" y="220" width="125" height="110" rx="8"/>
  <text x="547" y="244" class="th">Performance</text>
  <text x="547" y="270" class="ts">Indexes, queries,</text>
  <text x="547" y="288" class="ts">lazy loading</text>
</g>
<g class="c-red">
  <rect x="205" y="350" width="290" height="80" rx="8"/>
  <text x="217" y="374" class="th">Security</text>
  <text x="217" y="396" class="ts">Injection, CSRF, TLS, least privilege</text>
  <text x="217" y="414" class="ts">The cross-cutting concern across all categories</text>
</g>
<line x1="40" y1="465" x2="640" y2="465" class="divider"/>
</svg>
