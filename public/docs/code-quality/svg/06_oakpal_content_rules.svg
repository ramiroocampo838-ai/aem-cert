<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">OakPAL — Content package rules</text>
<text x="40" y="56" class="subtitle">Validates packages for repository correctness</text>
<g class="c-red">
  <rect x="40" y="90" width="600" height="70" rx="8"/>
  <text x="56" y="112" class="mono">OAKPAL-001</text>
  <text x="200" y="112" class="th">Scoped filter roots</text>
  <text x="540" y="112" class="ts" text-anchor="end" font-style="italic">Critical</text>
  <text x="56" y="140" class="ts">/apps/myproject deletes everything — use child paths</text>
</g>
<g class="c-red">
  <rect x="40" y="175" width="600" height="70" rx="8"/>
  <text x="56" y="197" class="mono">OAKPAL-002</text>
  <text x="200" y="197" class="th">No writes to /libs</text>
  <text x="540" y="197" class="ts" text-anchor="end" font-style="italic">Blocker</text>
  <text x="56" y="225" class="ts">/libs is immutable — overlay to /apps instead</text>
</g>
<g class="c-amber">
  <rect x="40" y="260" width="600" height="70" rx="8"/>
  <text x="56" y="282" class="mono">RequiredPrimaryType</text>
  <text x="200" y="282" class="th">Every node needs jcr:primaryType</text>
  <text x="540" y="282" class="ts" text-anchor="end" font-style="italic">Error</text>
  <text x="56" y="310" class="ts">cq:Page, cq:Component, nt:unstructured, sling:Folder</text>
</g>
<g class="c-amber">
  <rect x="40" y="345" width="600" height="70" rx="8"/>
  <text x="56" y="367" class="mono">ImmutableApps</text>
  <text x="200" y="367" class="th">/apps for code, not content</text>
  <text x="540" y="367" class="ts" text-anchor="end" font-style="italic">Warning</text>
  <text x="56" y="395" class="ts">Authored data and runtime values belong in /content</text>
</g>
<g class="c-amber">
  <rect x="40" y="430" width="600" height="70" rx="8"/>
  <text x="56" y="452" class="mono">OAKPAL-005</text>
  <text x="200" y="452" class="th">No overlapping filters</text>
  <text x="540" y="452" class="ts" text-anchor="end" font-style="italic">Major</text>
  <text x="56" y="480" class="ts">Ancestor + descendant = undefined install order</text>
</g>
<g class="c-red">
  <rect x="40" y="515" width="600" height="70" rx="8"/>
  <text x="56" y="537" class="mono">OAKPAL-006</text>
  <text x="200" y="537" class="th">Exclude rep:policy nodes</text>
  <text x="540" y="537" class="ts" text-anchor="end" font-style="italic">Critical</text>
  <text x="56" y="565" class="ts">Packaging ACLs overwrites production security</text>
</g>
<g class="c-amber">
  <rect x="40" y="600" width="600" height="70" rx="8"/>
  <text x="56" y="622" class="mono">OAKPAL-007</text>
  <text x="200" y="622" class="th">No /var in packages</text>
  <text x="540" y="622" class="ts" text-anchor="end" font-style="italic">Major</text>
  <text x="56" y="650" class="ts">Runtime data — queues, audits, indexes — never freeze it</text>
</g>
</svg>
