<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Severity levels &amp; Cloud Manager</text>
<text x="40" y="56" class="subtitle">How violations affect the deployment pipeline</text>
<g class="c-red">
  <rect x="40" y="90" width="600" height="65" rx="8"/>
  <text x="56" y="114" class="th">Blocker</text>
  <text x="200" y="114" class="ts">Build stops. Cannot be overridden.</text>
  <text x="56" y="138" class="ts" font-style="italic">e.g. OAKPAL-002, SEC-002, SEC-005, OSGI-002</text>
</g>
<g class="c-red">
  <rect x="40" y="175" width="600" height="65" rx="8"/>
  <text x="56" y="199" class="th">Critical</text>
  <text x="200" y="199" class="ts">Hard stop — code must be fixed.</text>
  <text x="56" y="223" class="ts" font-style="italic">e.g. S2095, S2885, OAKPAL-001, DISP-003, SEC-001</text>
</g>
<g class="c-amber">
  <rect x="40" y="260" width="600" height="65" rx="8"/>
  <text x="56" y="284" class="th">Important</text>
  <text x="200" y="284" class="ts">Pipeline pauses; can be overridden.</text>
  <text x="56" y="308" class="ts" font-style="italic">e.g. By Deployment Manager or Business Owner</text>
</g>
<g class="c-amber">
  <rect x="40" y="345" width="600" height="65" rx="8"/>
  <text x="56" y="369" class="th">Major</text>
  <text x="200" y="369" class="ts">Flagged in reporting; does not block.</text>
  <text x="56" y="393" class="ts" font-style="italic">e.g. OAKPAL-005, OAKPAL-007, DISP-006, PERF-003</text>
</g>
<g class="c-gray">
  <rect x="40" y="430" width="600" height="65" rx="8"/>
  <text x="56" y="454" class="th">Minor / Warning</text>
  <text x="200" y="454" class="ts">Informational only.</text>
  <text x="56" y="478" class="ts" font-style="italic">e.g. OAKPAL-008 (clientlib naming) and similar</text>
</g>
<line x1="40" y1="515" x2="640" y2="515" class="divider"/>
<text x="40" y="540" class="ts">Cloud Manager runs <tspan font-weight="500">SonarQube</tspan> + <tspan font-weight="500">AEM Analyzer</tspan> + <tspan font-weight="500">JaCoCo</tspan> (50% line coverage default).</text>
<text x="40" y="560" class="ts">Customize via sonar-project.properties at the repo root.</text>
</svg>
