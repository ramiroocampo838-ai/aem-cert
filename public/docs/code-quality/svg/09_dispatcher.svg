<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Dispatcher rules</text>
<text x="40" y="56" class="subtitle">AEM’s first security boundary — deny by default</text>
<g class="c-gray">
  <rect x="40" y="90" width="140" height="60" rx="8"/>
  <text x="56" y="115" class="th">Internet</text>
  <text x="56" y="135" class="ts">Public traffic</text>
</g>
<g class="c-red">
  <rect x="220" y="90" width="240" height="60" rx="8"/>
  <text x="236" y="115" class="th">Dispatcher</text>
  <text x="236" y="135" class="ts">Filters &#8226; cache &#8226; security headers</text>
</g>
<g class="c-teal">
  <rect x="500" y="90" width="140" height="60" rx="8"/>
  <text x="516" y="115" class="th">Publisher</text>
  <text x="516" y="135" class="ts">Port 4503 only</text>
</g>
<path d="M 180 120 L 220 120" class="arr" marker-end="url(#arrow)"/>
<path d="M 460 120 L 500 120" class="arr" marker-end="url(#arrow)"/>
<g class="c-red">
  <rect x="500" y="170" width="140" height="50" rx="8" stroke-dasharray="4 3"/>
  <text x="516" y="192" class="th">Author 4502</text>
  <text x="516" y="210" class="ts">BLOCKED</text>
</g>
<path d="M 460 145 L 500 195" class="arr" stroke="#A32D2D" stroke-dasharray="4 3"/>
<text x="380" y="180" class="ts" fill="#A32D2D">DISP-003</text>
<line x1="40" y1="245" x2="640" y2="245" class="divider"/>
<text x="40" y="270" class="th" fill="#3C3489">Critical Dispatcher rules</text>
<g class="c-red">
  <rect x="40" y="290" width="600" height="55" rx="8"/>
  <text x="56" y="312" class="mono">DISP-001</text>
  <text x="180" y="312" class="th">Request validation</text>
  <text x="56" y="334" class="ts">Block /../  ./  path traversal and reject DELETE/PUT/TRACE</text>
</g>
<g class="c-red">
  <rect x="40" y="360" width="600" height="55" rx="8"/>
  <text x="56" y="382" class="mono">DISP-004</text>
  <text x="180" y="382" class="th">Block default selectors</text>
  <text x="56" y="404" class="ts">Deny /*.infinity.json, /*.json, /bin/*, /bin/querybuilder.json</text>
</g>
<g class="c-amber">
  <rect x="40" y="430" width="600" height="55" rx="8"/>
  <text x="56" y="452" class="mono">DISP-005</text>
  <text x="180" y="452" class="th">Security headers</text>
  <text x="56" y="474" class="ts">Inject X-Frame-Options, CSP, X-Content-Type-Options, HSTS</text>
</g>
<g class="c-amber">
  <rect x="40" y="500" width="600" height="55" rx="8"/>
  <text x="56" y="522" class="mono">DISP-006</text>
  <text x="180" y="522" class="th">Query string allowlist</text>
  <text x="56" y="544" class="ts">Use /ignoreUrlParams — unrestricted = cache-busting DoS</text>
</g>
<text x="40" y="585" class="ts" font-style="italic">Filter principle: deny everything, then allowlist only required paths.</text>
</svg>
