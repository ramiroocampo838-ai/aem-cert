<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Why code quality matters in AEM</text>
<text x="40" y="56" class="subtitle">Four bad patterns that cause real production failures</text>
<g class="c-coral">
  <rect x="40" y="90" width="280" height="120" rx="8"/>
  <text x="56" y="120" class="th">Unclosed resources</text>
  <text x="56" y="148" class="ts">Exhaust the JCR session pool</text>
  <text x="56" y="168" class="ts">→ repository crashes</text>
</g>
<g class="c-purple">
  <rect x="360" y="90" width="280" height="120" rx="8"/>
  <text x="376" y="120" class="th">Mutable OSGi singletons</text>
  <text x="376" y="148" class="ts">Race conditions under concurrent</text>
  <text x="376" y="168" class="ts">load → corrupted shared state</text>
</g>
<g class="c-red">
  <rect x="40" y="240" width="280" height="120" rx="8"/>
  <text x="56" y="270" class="th">Direct writes to /libs</text>
  <text x="56" y="298" class="ts">Overwritten by every AEM</text>
  <text x="56" y="318" class="ts">upgrade → silent breakage</text>
</g>
<g class="c-amber">
  <rect x="360" y="240" width="280" height="120" rx="8"/>
  <text x="376" y="270" class="th">Broad Dispatcher filters</text>
  <text x="376" y="298" class="ts">Expose admin endpoints</text>
  <text x="376" y="318" class="ts">→ public attack surface</text>
</g>
<line x1="40" y1="395" x2="640" y2="395" class="divider"/>
<text x="40" y="420" class="ts">Code quality in AEM is not just style — it protects system stability and security.</text>
<text x="40" y="440" class="ts">Cloud Manager enforces a subset automatically; the rest depends on developer discipline.</text>
</svg>
