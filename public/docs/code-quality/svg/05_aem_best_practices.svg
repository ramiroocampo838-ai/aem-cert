<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">AEM best practices</text>
<text x="40" y="56" class="subtitle">AEM-specific patterns beyond standard Java rules</text>
<g class="c-coral">
  <rect x="40" y="90" width="600" height="85" rx="8"/>
  <text x="56" y="114" class="mono">AEM-BP-001</text>
  <text x="200" y="114" class="th">ResourceResolver lifecycle</text>
  <text x="56" y="138" class="ts">Every resolver from ResourceResolverFactory must be closed</text>
  <text x="56" y="156" class="ts">in the same method — use try-with-resources</text>
</g>
<g class="c-coral">
  <rect x="40" y="195" width="600" height="85" rx="8"/>
  <text x="56" y="219" class="mono">AEM-BP-002</text>
  <text x="200" y="219" class="th">Service user pattern</text>
  <text x="56" y="243" class="ts">Replace getAdministrativeResourceResolver() with</text>
  <text x="56" y="261" class="ts">getServiceResourceResolver() + ServiceUserMapper config</text>
</g>
<g class="c-purple">
  <rect x="40" y="300" width="600" height="85" rx="8"/>
  <text x="56" y="324" class="mono">AEM-BP-004</text>
  <text x="200" y="324" class="th">Sling Models for business logic</text>
  <text x="56" y="348" class="ts">HTL is intentionally limited — logic belongs in @Model</text>
  <text x="56" y="366" class="ts">classes, testable with AEM Mocks</text>
</g>
<g class="c-purple">
  <rect x="40" y="405" width="600" height="85" rx="8"/>
  <text x="56" y="429" class="mono">AEM-BP-006</text>
  <text x="200" y="429" class="th">High-level APIs</text>
  <text x="56" y="453" class="ts">PageManager, TagManager, AssetManager apply AEM business</text>
  <text x="56" y="471" class="ts">rules — raw session.addNode() bypasses them</text>
</g>
<g class="c-amber">
  <rect x="40" y="510" width="600" height="85" rx="8"/>
  <text x="56" y="534" class="mono">AEM-BP-008</text>
  <text x="200" y="534" class="th">Externalize paths</text>
  <text x="56" y="558" class="ts">Never hardcode /content/mysite/en — use OSGi properties</text>
  <text x="56" y="576" class="ts">or Context-Aware Configurations (CAConfig in /conf)</text>
</g>
<line x1="40" y1="615" x2="640" y2="615" class="divider"/>
<text x="40" y="638" class="ts">OSGi lifecycle: <tspan font-weight="500">@Activate</tspan> on bind &#8226; <tspan font-weight="500">@Modified</tspan> on config change &#8226; <tspan font-weight="500">@Deactivate</tspan> to release resources</text>
</svg>
