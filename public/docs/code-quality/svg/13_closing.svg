<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540">
  <style>
    .t  { font-family: Helvetica, Arial; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: Helvetica, Arial; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: Helvetica, Arial; font-size: 14px; font-weight: 500; }
    .title    { font-size: 18px; font-weight: 500; fill: #2C2C2A; }
    .subtitle { font-size: 12px; fill: #5F5E5A; }
    .mono     { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2C2C2A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-red    rect { fill: #FCEBEB; stroke: #A32D2D; }
    .c-red    text { fill: #791F1F; }
    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-green  rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green  text { fill: #27500A; }
    .c-pink   rect { fill: #FCE8F1; stroke: #A8316E; }
    .c-pink   text { fill: #7E2253; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #2C2C2A; }
    .arr     { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    .divider { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
    rect { stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none"
            stroke="context-stroke" stroke-width="1.5" />
    </marker>
  </defs>
<text x="40" y="36" class="title">Closing — what to remember</text>
<text x="40" y="56" class="subtitle">Eight categories, one purpose: a stable, secure AEM</text>
<g class="c-purple">
  <rect x="40" y="90" width="290" height="65" rx="8"/>
  <text x="56" y="116" class="th">SonarQube</text>
  <text x="56" y="140" class="ts">Java correctness &amp; maintainability</text>
</g>
<g class="c-coral">
  <rect x="350" y="90" width="290" height="65" rx="8"/>
  <text x="366" y="116" class="th">AEM Best Practices</text>
  <text x="366" y="140" class="ts">AEM-specific Java patterns</text>
</g>
<g class="c-amber">
  <rect x="40" y="170" width="290" height="65" rx="8"/>
  <text x="56" y="196" class="th">OakPAL</text>
  <text x="56" y="220" class="ts">Content &amp; repository correctness</text>
</g>
<g class="c-teal">
  <rect x="350" y="170" width="290" height="65" rx="8"/>
  <text x="366" y="196" class="th">HTL Rules</text>
  <text x="366" y="220" class="ts">Template security &amp; XSS prevention</text>
</g>
<g class="c-blue">
  <rect x="40" y="250" width="290" height="65" rx="8"/>
  <text x="56" y="276" class="th">OSGi / Felix</text>
  <text x="56" y="300" class="ts">Bundle modularity &amp; lifecycle</text>
</g>
<g class="c-red">
  <rect x="350" y="250" width="290" height="65" rx="8"/>
  <text x="366" y="276" class="th">Dispatcher</text>
  <text x="366" y="300" class="ts">HTTP security &amp; cache control</text>
</g>
<g class="c-green">
  <rect x="40" y="330" width="290" height="65" rx="8"/>
  <text x="56" y="356" class="th">Performance</text>
  <text x="56" y="380" class="ts">JCR queries &amp; efficient access</text>
</g>
<g class="c-pink">
  <rect x="350" y="330" width="290" height="65" rx="8"/>
  <text x="366" y="356" class="th">Security</text>
  <text x="366" y="380" class="ts">Injection, CSRF, TLS, least privilege</text>
</g>
<line x1="40" y1="430" x2="640" y2="430" class="divider"/>
<text x="40" y="455" class="th" fill="#3C3489">For the exam, focus on:</text>
<text x="40" y="478" class="ts">&#8226; The Critical and Blocker rules by category, with their fix patterns</text>
<text x="40" y="498" class="ts">&#8226; Critical (hard stop) vs Important (overridable) in Cloud Manager gates</text>
<text x="40" y="518" class="ts">&#8226; The overlay pattern for /libs and the service user pattern for resources</text>
</svg>
